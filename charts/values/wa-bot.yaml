# wa-bot — WhatsApp webhook bot (Node/Express). Root-relative routes
# (/webhook, /health), exposed at mts.iudx.io/wa with the prefix
# stripped. Register this exact URL as the WhatsApp Business webhook:
# https://mts.iudx.io/wa/webhook
image:
  name: asia-south1-docker.pkg.dev/spartan-calling-484711-e5/test-gke-apps/wa-bot@sha256:882e2c5c22b38389ee7327b4e549c87203342b578d22cb0be3801a6f1812b24c

containerPort: 3000

env:
  - name: BACKEND_URL
    value: http://backend
  - name: GRAPH_VERSION
    value: v21.0
  - name: OTP_PUBLIC_URL
    value: https://mts.iudx.io
  - name: LLM_MODEL
    value: google/gemini-2.5-flash

serviceAccountName: wa-bot

# Plain Kubernetes Secret, created once per namespace ahead of install:
#   kubectl -n <ns> create secret generic wa-bot-secrets \
#     --from-literal=WHATSAPP_TOKEN=... \
#     --from-literal=PHONE_NUMBER_ID=... \
#     --from-literal=VERIFY_TOKEN=... \
#     --from-literal=OPENROUTER_API_KEY=...
envFromSecret:
  enabled: true
  secretName: wa-bot-secrets

readinessProbe:
  type: httpGet
  httpGet:
    path: /health
    port: http
livenessProbe:
  type: httpGet
  httpGet:
    path: /health
    port: http

httpRoute:
  enabled: true
  hostname: mts.iudx.io
  # The LB health check hits the pod directly, bypassing the HTTPRoute
  # rewrite, so this is the real internal path, not /wa/health.
  healthCheck:
    enabled: true
    path: /health
  paths:
    - type: PathPrefix
      value: /wa
      rewritePathPrefix:
        enabled: true
        value: ""

ingress:
  enabled: true
  hostname: mts.iudx.io
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  paths:
    - path: /wa(/|$)(.*)
      pathType: ImplementationSpecific
  # Same cert as the other services on this host — provisioned by frontend's
  # Ingress (see its clusterIssuer comment). No clusterIssuer set here.
  tls:
    enabled: true
    secretName: mts-iudx-io-tls
