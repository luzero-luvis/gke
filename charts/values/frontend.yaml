# frontend — React SPA served by a small Node server (serve.cjs), not
# nginx despite the docker-compose comment. Public at mts.iudx.io/
# (catch-all — lowest route precedence, everything more specific above
# wins). Its own server also internally proxies /api and /webhook, but
# those are served directly by backend/wa-bot's own routes here instead.
image:
  name: asia-south1-docker.pkg.dev/spartan-calling-484711-e5/test-gke-apps/frontend@sha256:b1c6dcd3135d9dbebe368051ebf334243fa04297e132cd33956ea8b4cc581fc6

containerPort: 55555

env:
  - name: BACKEND_URL
    value: http://backend
  - name: WA_BOT_URL
    value: http://wa-bot

httpRoute:
  enabled: true
  hostname: mts.iudx.io
  paths:
    - type: PathPrefix
      value: /

ingress:
  enabled: true
  hostname: mts.iudx.io
  paths:
    - path: /
      pathType: Prefix
  # This is the one service whose Ingress owns the cert-manager Certificate
  # for mts.iudx.io — the other 4 services' Ingress objects reference the
  # same tls.secretName without a clusterIssuer, so cert-manager doesn't try
  # to also manage it (it only lets one Certificate own a given Secret;
  # annotating all 5 would make them fight over ownership).
  tls:
    enabled: true
    secretName: mts-iudx-io-tls
    clusterIssuer: letsencrypt-prod
