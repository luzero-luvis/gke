# ondc-adapter — FastAPI ONDC TRV10 BAP. Its own routes are root-relative
# (/health, /{action}), so it's exposed at mts.iudx.io/ondc with the
# prefix stripped before forwarding. This means the real ONDC network
# registration for this BAP's callback base URL must be
# https://mts.iudx.io/ondc — register it exactly that way.
image:
  name: asia-south1-docker.pkg.dev/spartan-calling-484711-e5/test-gke-apps/ondc-adapter@sha256:67997b64f100866e846979fe95a87c7798fa98550fb5c2bb906e28acd51c60b3

containerPort: 5060

env:
  - name: ONDC_ADAPTER_PORT
    value: "5060"
  - name: ONDC_ADAPTER_DB
    value: /data/adapter.sqlite3
  - name: MOBILITY_API_NOTIFY_URL
    value: http://mobility-api/mobility/v1/internal/ondc-events

serviceAccountName: ondc-adapter

# Plain Kubernetes Secret, created once per namespace ahead of install:
#   kubectl -n <ns> create secret generic ondc-adapter-secrets \
#     --from-literal=MOBILITY_API_NOTIFY_SECRET="$(openssl rand -hex 32)"
# Must match mobility-api-secrets' ADAPTER_NOTIFY_SECRET exactly.
envFromSecret:
  enabled: true
  secretName: ondc-adapter-secrets

# SQLite at ONDC_ADAPTER_DB holding `transactions`/`messages` — must survive
# restarts, per the chart's own persistence.enabled comment.
persistence:
  enabled: true
  mountPath: /data
  size: 2Gi

readinessProbe:
  type: httpGet
  httpGet:
    path: /health
    port: http
livenessProbe:
  type: httpGet
  httpGet:
    path: /health
    port: http

httpRoute:
  enabled: true
  hostname: mts.iudx.io
  # The LB health check hits the pod directly, bypassing the HTTPRoute
  # rewrite, so this is the real internal path, not /ondc/health.
  healthCheck:
    enabled: true
    path: /health
  paths:
    - type: PathPrefix
      value: /ondc
      rewritePathPrefix:
        enabled: true
        value: ""

ingress:
  enabled: true
  hostname: mts.iudx.io
  # nginx has no first-class prefix-strip field (unlike httpRoute's
  # rewritePathPrefix) — the regex-capture + rewrite-target annotation pair
  # is its standard way to strip a matched prefix before forwarding.
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  paths:
    - path: /ondc(/|$)(.*)
      pathType: ImplementationSpecific
  # Same cert as the other services on this host — provisioned by frontend's
  # Ingress (see its clusterIssuer comment). No clusterIssuer set here.
  tls:
    enabled: true
    secretName: mts-iudx-io-tls
