# backend — Flask API. Public at mts.iudx.io/api (its own routes are
# already prefixed /api/*, so no path rewrite needed).
image:
  name: asia-south1-docker.pkg.dev/spartan-calling-484711-e5/test-gke-apps/backend@sha256:ed0eee759df88ef7e814f9694ba9919c7973e387039ac8a2b714ca9c3ba2705c

containerPort: 5050

env:
  - name: PORT
    value: "5050"
  - name: OTP_URL
    value: http://gateway/otp/gtfs/v1
  - name: OTP_GATEWAY_URL
    value: http://gateway
  - name: WA_BOT_URL
    value: http://wa-bot

serviceAccountName: backend

# jwtutil.py reads OTP_PLANNER_SECRET to sign the JWT backend sends to
# gateway. Without the real value here (Dockerfile only bakes in the
# placeholder "changeme"), gateway's signature check fails with 401 and
# /api/health permanently reports "otp": "down" even though otp/gateway
# are both actually fine.
#
# Plain Kubernetes Secret, created once per namespace ahead of install:
#   kubectl -n <ns> create secret generic backend-secrets \
#     --from-literal=OTP_PLANNER_SECRET="$(openssl rand -hex 32)"
# Must match gateway-secrets' OTP_PLANNER_SECRET exactly.
envFromSecret:
  enabled: true
  secretName: backend-secrets

readinessProbe:
  type: httpGet
  httpGet:
    path: /api/health
    port: http
livenessProbe:
  type: httpGet
  httpGet:
    path: /api/health
    port: http

httpRoute:
  enabled: true
  hostname: mts.iudx.io
  healthCheck:
    enabled: true
    path: /api/health
  paths:
    - type: PathPrefix
      value: /api

ingress:
  enabled: true
  hostname: mts.iudx.io
  paths:
    - path: /api
      pathType: Prefix
  # Same cert as the other services on this host — provisioned by frontend's
  # Ingress (see its clusterIssuer comment). No clusterIssuer set here.
  tls:
    enabled: true
    secretName: mts-iudx-io-tls
