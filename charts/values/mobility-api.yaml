# mobility-api — client-facing FastAPI service. Public at
# mts.iudx.io/api/v1 (more specific than backend's /api, so Gateway
# API routes /api/v1/* here and everything else under /api/* to backend).
image:
  name: asia-south1-docker.pkg.dev/spartan-calling-484711-e5/test-gke-apps/mobility-api@sha256:2be0d1d28caf3aeed6cb4640f94cef408ef6999819fa8b4cf4d5345cac9cc675

containerPort: 8000

env:
  - name: ONDC_ADAPTER_URL
    value: http://ondc-adapter

serviceAccountName: mobility-api

# readOnlyRootFilesystem leaves uv no writable cache dir except the chart's
# own "tmp" emptyDir.
env:
  - name: ONDC_ADAPTER_URL
    value: http://ondc-adapter
  - name: UV_CACHE_DIR
    value: /tmp/uv-cache

# Plain Kubernetes Secret, created once per namespace ahead of install:
#   kubectl -n <ns> create secret generic mobility-api-secrets \
#     --from-literal=ADAPTER_NOTIFY_SECRET="$(openssl rand -hex 32)"
# Must match ondc-adapter-secrets' MOBILITY_API_NOTIFY_SECRET exactly —
# same value, different env var name on each side of that callback.
envFromSecret:
  enabled: true
  secretName: mobility-api-secrets

readinessProbe:
  type: httpGet
  httpGet:
    path: /api/v1/health
    port: http
livenessProbe:
  type: httpGet
  httpGet:
    path: /api/v1/health
    port: http

httpRoute:
  enabled: true
  hostname: mts.iudx.io
  # Without this, GKE's Gateway defaults the GCP-level backend health check
  # to "/", which 404s and marks the backend UNHEALTHY at the LB even
  # though the pod itself is fine — point it at the real health path.
  healthCheck:
    enabled: true
    path: /api/v1/health
  # mobility.py has ~13 public endpoints under /mobility/v1 (create trip,
  # quotes, etc.) plus the health check under /api/v1 (api_router) — both
  # need to be reachable.
  paths:
    - type: PathPrefix
      value: /api/v1
    - type: PathPrefix
      value: /mobility/v1

ingress:
  enabled: true
  hostname: mts.iudx.io
  paths:
    - path: /api/v1
      pathType: Prefix
    - path: /mobility/v1
      pathType: Prefix
  # Same cert as the other services on this host — provisioned by frontend's
  # Ingress (see its clusterIssuer comment). No clusterIssuer set here.
  tls:
    enabled: true
    secretName: mts-iudx-io-tls
