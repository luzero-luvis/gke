{{/*
Alternative to httproute.yaml for clusters running ingress-nginx instead of
the Gateway API. This chart never creates the IngressClass or the TLS
Secret — cert-manager (or similar) provisions the Secret separately.
*/}}
{{- if .Values.ingress.enabled }}
{{- $annotations := merge dict .Values.ingress.annotations }}
{{- if .Values.ingress.tls.clusterIssuer }}
{{- $annotations = merge $annotations (dict "cert-manager.io/cluster-issuer" .Values.ingress.tls.clusterIssuer) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mts-ijp.fullname" . }}
  namespace: {{ include "mts-ijp.namespace" . }}
  labels:
    {{- include "mts-ijp.labels" . | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.hostname is required when ingress.enabled" .Values.ingress.hostname | quote }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ required "ingress.hostname is required when ingress.enabled" .Values.ingress.hostname | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "mts-ijp.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
{{- end }}
