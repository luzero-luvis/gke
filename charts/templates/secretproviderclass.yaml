{{- if .Values.secretProviderClass.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "mts-ijp.fullname" . }}-secrets
  namespace: {{ include "mts-ijp.namespace" . }}
  labels:
    {{- include "mts-ijp.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- $projectNumber := required "secretProviderClass.projectNumber is required when secretProviderClass.enabled" .Values.secretProviderClass.projectNumber }}
      {{- range .Values.secretProviderClass.secrets }}
      - resourceName: "projects/{{ $projectNumber }}/secrets/{{ .secretId }}/versions/{{ .version | default "latest" }}"
        fileName: {{ .key | quote }}
      {{- end }}
  secretObjects:
    - secretName: {{ required "secretProviderClass.secretName is required when secretProviderClass.enabled" .Values.secretProviderClass.secretName }}
      type: Opaque
      data:
        {{- range .Values.secretProviderClass.secrets }}
        - objectName: {{ .key | quote }}
          key: {{ .key }}
        {{- end }}
{{- end }}
