apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app
  namespace: apps
  annotations:
    networking.gke.io/certmap: "${CERTIFICATE_MAP}"
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: "${ADDRESS_NAME}"
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "${HOSTNAME}"
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: apps
spec:
  parentRefs:
    - {name: app, sectionName: https}
  hostnames: ["${HOSTNAME}"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: app, port: 80}
