apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app
  namespace: apps
  annotations:
    networking.gke.io/certmap: "${CERTIFICATE_MAP}"
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: "${ADDRESS_NAME}"
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: app
  namespace: apps
spec:
  default:
    sslPolicy: "${SSL_POLICY}"
  targetRef: {group: gateway.networking.k8s.io, kind: Gateway, name: app}
